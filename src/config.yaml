    - "@reynoldsburgnazchurch"
    - "@WhitehallNaz/videos"
  
  # Default suffix for channels without one specified
  channel_default_suffix: "/videos"
  
  # Processing parameters
  checkpoint_video_count: 5
  sleep_delay: 1.0  # seconds between video requests
  
  # Video filtering criteria
  video_length_min: 300        # 5 minutes in seconds
  video_length_max: 7200       # 120 minutes in seconds
  video_date_after: "20000101" # Videos must be published after this date (YYYYMMDD)
  video_date_before: "20250401" # Videos must be published before this date (YYYYMMDD)
  video_language: ["en"]       # Allowed video language(s)
  video_views_min: 20          # Minimum view count
  video_views_max: 1000000     # Maximum view count
  video_upvotes_min: 0         # Minimum upvotes (like_count)
  video_upvotes_max: 1000000   # Maximum upvotes (like_count)
  
  # Output filenames
  output_files:
    all_json: "all_get_channel_video_ids.json"
    accepted_json: "accepted_get_channel_video_ids.json"
    rejected_json: "rejected_get_channel_video_ids.json"
    report: "report_get_channel_video_ids.txt"
# ====== STEP2: YOUTUBE AUDIO DOWNLOAD ======
step2:
  # Input metadata file information
  metadata_json_dir: "data/videos_metadata_annalia_20250401"
  metadata_json_file: "accepted_get_channel_video_ids.json"
  
  # Audio download approach
  audio_format_option: ["ydl_opts", ["wav", "mp3"]]  # Options: "ydl_opts" or "alt_formats"
  # If using "ydl_opts", these are the preferred formats to try directly
  # If using "alt_formats", these are alternative formats to try if primary fails
  
  # Audio download criteria
  audio_lang: ["en", "es"]  # Allowed languages
  audio_kbps_min: 128  # Minimum audio quality
  
  # Rate limiting and retry settings
  sleep_delay: 1.0  # Seconds between video requests
  retry_delay: 5.0  # Seconds to wait before retrying a failed download
  max_retries: 3    # Maximum retry attempts for failed downloads
  
  # Output directory and file naming
  audio_output_dir: "data/audio"
  channel_prefix: "channel_at_"  # Prefix for channel directories
  audio_file_prefix: "audio_file_"  # Prefix for audio files
  
  # Reporting and metadata output
  meta_audio_report_dir: "data/audio/audio_metadata"  # Directory for reports and metadata
  output_files:
    all_json: "all_audio_downloads.json"
    success_json: "successful_audio_downloads.json"
    failed_json: "failed_audio_downloads.json" 
    report: "audio_download_report.txt"

# ====== GENERAL CONFIGURATION ======
# Input Files
YT_CHANNEL_CSV: "yt_channels.csv"
YT_VIDEO_CSV: "yt_videos.csv"
# Output Paths
OUTPUT_YT_VIDEO_CSV: "output_yt_videos.csv"
# Video Filtering Parameters
MIN_LEN_MINS: 0 # Setting to 0 to accept any length videos for testing
MAX_LEN_MINS: 300 # Increased to allow most videos
LANG_INCL_LS: ['en']
FILTER_EXCLUDE_TITLE: ['going deeper', 'sunday school']
DATE_START: "" # Format: YYYY-MM-DD
DATE_END: "" # Format: YYYY-MM-DD
# Method Order - try methods in this order
# Options: 'api', 'yt-dlp', 'audio'
METHOD_ORDER_LS: ['audio'] # ['api', 'yt-dlp', 'audio']
# Speech-to-Text Processing
PROCESS_SST_AUDIO: true # If true, convert downloaded audio to transcripts
# Rate Limiting and Anti-Blocking
MIN_WAIT_TIME: 0.5 # Minimum wait time in seconds
# Channel Processing Limits
MAX_PAGES_PER_CHANNEL: 5 # Maximum number of result pages to process per channel
MAX_VIDEOS_PER_CHANNEL: 10 # Maximum number of videos to process per channel
# Logging Configuration
LOGGING_LEVEL: "INFO" # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL

# Audio Download Settings
AUDIO_QUALITY: "64"  # MP3 quality in kbps (lower = smaller files)
USE_GPU_ACCELERATION: true  # Use GPU acceleration for audio processing
MAX_AUDIO_LENGTH_MINS: 30  # Maximum length in minutes for audio files
SPLIT_LONG_AUDIO: true  # Whether to split long audio files into chunks
AUDIO_CHUNK_MINS: 10  # Size of each chunk in minutes if splitting

# Optional: Configure Whisper model size
# Options: tiny, base, small, medium, large
WHISPER_MODEL_SIZE: "base"  # Smaller models are faster but less accurate